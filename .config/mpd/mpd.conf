music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"

# Esta parte es VITAL para que escuches algo
audio_output {
        type            "pulse" # O "pipewire" si usas lo más nuevo de Debian
        name            "pulse audio"
}

# Para el visualizador de barritas en ncmpcpp
audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}
