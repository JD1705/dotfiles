[colors]
background = #1e1e2e
background-alt = #181825
foreground = #cdd6f4
primary = #89b4fa
secondary = #b4befe
alert = #f38ba8
disabled = #313244
border = #89b4fa

[utility]
sep = ""

[bar/main]
width = 15%
height = 14pt
radius-top = 20

offset-x = 42.5%
offset-y = 5pt

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1pt
border-color = ${colors.border}

padding-left = 0
padding-right = 1

module-margin = 1

separator = ${utility.sep}
separator-foreground = ${colors.disabled}

font-0 = Noto Sans CJK JP:size=9;2
font-1 = FiraCode Nerd Font:size=9;2

#modules-left = trash-can xworkspaces
modules-center = xworkspaces 
#modules-right = pulseaudio memory cpu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true

[bar/left]
width = 20%
height = 14pt
radius-top-right = 20

offset-x = .9%
offset-y = 5pt

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1pt
border-color = ${colors.border}

padding-left = 2
padding-right = 5

module-margin = 1

separator = ${utility.sep}
separator-foreground = ${colors.disabled}

font-0 = Noto Sans CJK JP:size=9;2
font-1 = FiraCode Nerd Font:size=9;2

modules-left = calendar date
#modules-center = date
modules-right = trash-can

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true

[bar/right]
width = 14.7%
height = 14pt
radius-top-left = 20

offset-x = 84.6%
offset-y = 5pt

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1pt
border-color = ${colors.border}

padding-left = 0
padding-right = 1

module-margin = 1

separator = ${utility.sep}
separator-foreground = ${colors.disabled}

font-0 = Noto Sans CJK JP:size=9;2
font-1 = FiraCode Nerd Font:size=9;2

#modules-left = trash-can xworkspaces
#modules-center = date
modules-center = pulseaudio memory cpu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true

[bar/lower]
width = 15%
height = 14pt
radius-bottom = 20

bottom = true

offset-x = 42.5%
offset-y = 5
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 1pt
border-color = ${colors.border}

padding-left = 0
padding-right = 1

module-margin = 1

separator = ${utility.sep}
separator-foreground = ${colors.disabled}

font-0 = Noto Sans CJK JP:size=9;2
font-1 = FiraCode Nerd Font:size=9;2

; modules-left = playlist
modules-center = music 
; modules-right = nightlight

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true


[module/systray]
type = internal/tray

format-margin = 5pt
tray-spacing = 5pt

[module/xworkspaces]
type = internal/xworkspaces
format = <label-state>
; label-active = ⦿
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-foreground = ${colors.secondary}
label-active-padding = 1.5

; label-occupied = —
label-occupied-background = ${colors.background-alt}
label-occupied-foreground = ${colors.disabled}
label-occupied-padding = 1.5

; label-urgent = ⦿
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

; label-empty = -
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "    "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "  "
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "    "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "    "
format-prefix-foreground = ${colors.primary}
label = "%percentage:2%%  "

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[module/ethernet]
type = custom/script
exec = if [ "$(nmcli -t -g GENERAL.STATE dev show ens33)" != "disconnected	" ]; then echo "      "; else echo "      "; fi
interval = 1
click-left = ~/.config/polybar/ethernet_status.sh connect  # Alternar conexión
click-right = ~/.config/polybar/ethernet_status.sh disconnect  # Forzar desconexión

[module/trash-can]
type = custom/script
exec = ~/polybar-scripts/info-trash.sh
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
interval = 3
click-left = ~/polybar-scripts/info-trash.sh --clean &

[module/calendar]
type = custom/text
content = "      "
content-foreground = ${colors.primary}

click-left = gsimplecal

[module/bluetooth]
type = custom/text
content = "  "

click-left = ~/.config/polybar/bluetooth.sh

[module/playlist]
type = custom/text
# Icono o texto del botón
content = "       "
content-foreground = ${colors.primary}
content-background = ${colors.background}

; click-left = pgrep -f "floating_playlist" && xdotool search --class "floating_playlist" windowkill || i3-msg "exec --no-startup-id terminator --class 'floating_playlist' -e ncmpcpp -n"
click-left = ~/.config/polybar/playlist.sh

[module/music]
type = custom/script
exec = ~/.config/polybar/music_scroll.sh
tail = true
click-left = mpc toggle
click-right = mpc next

[module/nightlight]
type = custom/ipc

#your formatting
format = "    "
format-prefix-foreground = ${colors.black}
format-foreground = ${colors.primary}

initial = 1

hook-0 = bash ~/.config/polybar/nightlight.sh -
hook-1 = bash ~/.config/polybar/nightlight.sh +

click-left = "#nightlight.hook.0"
click-right = "#nightlight.hook.1"
#also available: click-left/middle/right, double-click-left/right

[settings]
screenchange-reload = true
pseudo-transparency = true

year-kanji = 年
month-kanji = 月
day-kanji = 日

; vim:ft=dosini
