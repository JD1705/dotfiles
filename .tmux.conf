# ============================================================================
# CONFIGURACIÓN BÁSICA DE TMUX
# ============================================================================

# Cambiar tecla líder de Ctrl+b a Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Renumerar ventanas automáticamente al cerrar
set -g renumber-windows on

# Activar mouse (scroll, selección, resize)
set -g mouse on

# Tiempo de escape cero para mejor respuesta
set -sg escape-time 0

# ============================================================================
# BARRA DE ESTADO (ARRIBA)
# ============================================================================

# Posición de la barra
set -g status-position top

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Colores y estilo de la barra
# set -g status-bg "#1a1b26"
# set -g status-fg "#c0caf5"
#
# # Lado izquierdo - Nombre de sesión
# set -g status-left "#[fg=blue]#S #[fg=#c0caf5]|"
#
# # Lado derecho - Fecha y hora
# set -g status-right "#[fg=cyan]%d %b %Y #[fg=white]| #[fg=yellow]%H:%M"
#
# # Estilo de ventanas
# set -g window-status-current-format "#[fg=white]#I:#W"
# set -g window-status-format "#[fg=colour245]#I:#W"
# set -g window-status-separator "  "

# ============================================================================
# PANELES Y BORDES
# ============================================================================

# Colores de bordes de paneles
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour4

# ============================================================================
# ATAJOS PERSONALIZADOS
# ============================================================================

# Recargar configuración (prefix + r)
bind r source-file ~/.tmux.conf \; display "¡Configuración recargada!"

# Dividir paneles más intuitivo
bind | split-window -h
bind - split-window -v

# Navegación entre paneles con Alt+flechas
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Cambiar tamaño de paneles con Ctrl+flechas
bind -n C-l resize-pane -L 5
bind -n C-h resize-pane -R 5
bind -n C-j resize-pane -U 5
bind -n C-k resize-pane -D 5

bind -n S-Right  next-window 
bind -n S-Left previous-window

# ============================================================================
# PLUGINS (TPM)
# ============================================================================

# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin '2kabhishek/tmux2k'

# Configuración de prefix-highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=white,bg=red'

# Configuración de resurrect (guardar sesiones)
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval 15

# Configuración de yank (copiar al portapapeles del sistema)
set -g @yank_selection 'clipboard'

# Actualizar barra de estado para mostrar prefix-highlight
set -g @tmux2k-theme 'catppuccin'
# set -g @tmux2k-bg-color "#1a1b26"
# set -g @tmux2k-fg-color "#c0caf5"
set -g @tmux2k-left-plugins "session git cwd"
set -g @tmux2k-right-plugins "updates time"
# set -g @tmux2k-blue "#7aa2f7"
# set -g @tmux2k-light-blue "#7dcfff"
# set -g @tmux2k-dark-blue "#bb9af7"
# set -g @tmux2k-black "#1a1b26"
# set -g @tmux2k-session-colors "light_blue black"
# set -g @tmux2k-git-colors "blue black"
# set -g @tmux2k-cwd-colors "dark_blue black"
# set -g @tmux2k-updates-colors "blue black"

set -g @tmux2k-refresh-rate 5

# ============================================================================
# INICIALIZACIÓN DE TPM (DEBE IR AL FINAL)
# ============================================================================

# Inicializar Team Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
